<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appareil Jetable</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; margin: 0; }
        .camera-btn {
            background: #ff4757; color: white; padding: 15px 30px; font-size: 18px;
            border: none; border-radius: 50px; cursor: pointer; display: inline-block; transition: 0.3s;
        }
        #cameraInput { display: none; }
        #status { margin-top: 20px; font-size: 16px; font-weight: bold; color: #333; }
        .success { color: #2ed573 !important; }

        /* Le modal de confirmation */
        #confirmationOverlay {
            display: none; /* Invisible par défaut */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center; align-items: center; flex-direction: column;
            color: white; padding: 20px; box-sizing: border-box;
        }
        #previewImage {
            max-width: 90%; max-height: 60vh;
            border: 3px solid white; border-radius: 10px;
            margin-bottom: 20px;
        }
        .action-btns { display: flex; gap: 15px; }
        .action-btn {
            color: white; padding: 12px 20px; font-size: 16px;
            border: none; border-radius: 30px; cursor: pointer; transition: 0.2s;
        }
        .save-btn { background: #2ed573; } /* Vert */
        .send-btn { background: #5352ed; } /* Bleu */
        .cancel-btn { background: #ccc; color: black; margin-top: 15px; font-size: 14px; }
        .loading { background: #ffaa00; pointer-events: none; }
    </style>
</head>
<body>

    <h1>📸 Capturez la soirée</h1>
    <p>Prenez une photo, choisissez comment la garder !</p>

    <label for="cameraInput" class="camera-btn">
        Prendre une photo
    </label>
   
    <input type="file" accept="image/*" capture="environment" id="cameraInput">

    <div id="status">En attente d'une photo...</div>

    <!-- LE NOUVEAU MODAL DE CONFIRMATION -->
    <div id="confirmationOverlay">
        <h2>Votre Photo :</h2>
        <img id="previewImage" src="" alt="Aperçu">
        <div class="action-btns">
            <!-- Bouton Local -->
            <button id="saveLocalBtn" class="action-btn save-btn">📥 Enregistrer (mon téléphone)</button>
            <!-- Bouton Drive -->
            <button id="sendDriveBtn" class="action-btn send-btn">☁️ Envoyer (Album Collectif)</button>
        </div>
        <button id="cancelBtn" class="action-btn cancel-btn">Recommencer</button>
    </div>

    <script>
        // --- 1. CONFIGURATION OBLIGATOIRE ---
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwKXFaYzZLDJMf-Uhxa8deJ4NULojg9OeOg63eo6bs3XwnWozAANIJ7xhOsV-LBJsAF/exec"; // Collez votre URL ici

        const cameraInput = document.getElementById('cameraInput');
        const statusDiv = document.getElementById('status');
        const overlay = document.getElementById('confirmationOverlay');
        const previewImage = document.getElementById('previewImage');
        const saveLocalBtn = document.getElementById('saveLocalBtn');
        const sendDriveBtn = document.getElementById('sendDriveBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        let originalFile; // On stocke le fichier brut pour la galerie

        cameraInput.addEventListener('change', (event) => {
            originalFile = event.target.files[0];
            if (!originalFile) return;

            // Afficher l'aperçu immédiatement
            const readerPreview = new FileReader();
            readerPreview.readAsDataURL(originalFile);
            readerPreview.onload = (e) => {
                previewImage.src = e.target.result;
                overlay.style.display = 'flex'; // Afficher le modal
                statusDiv.innerText = "Choisissez une action.";
            }
        });

        // --- ACTION 1 : Enregistrer Localement (Galerie du téléphone) ---
        saveLocalBtn.addEventListener('click', () => {
            // Créer un lien temporaire pour télécharger le fichier brut
            const a = document.createElement("a");
            a.href = previewImage.src;
            a.download = "photo_" + Date.now() + ".jpg"; // Nom du fichier
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
           
            // Masquer le bouton de sauvegarde pour cette image
            saveLocalBtn.innerText = "✅ Enregistré !";
            saveLocalBtn.disabled = true;
        });

        // --- ACTION 2 : Envoyer sur le Drive ---
        sendDriveBtn.addEventListener('click', () => {
            sendDriveBtn.classList.add("loading");
            sendDriveBtn.innerText = "⏳ Envoi collectif...";
            statusDiv.innerText = "Transmission vers l'album Drive...";

            // On lance la compression AVANT l'envoi
            const readerSend = new FileReader();
            readerSend.readAsDataURL(originalFile);
            readerSend.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
               
                img.onload = function() {
                    // Compression existante (75% JPEG, max 1600px)
                    const MAX_WIDTH = 1600;
                    const MAX_HEIGHT = 1600;
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > MAX_WIDTH) { height = Math.round((height *= MAX_WIDTH / width)); width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width = Math.round((width *= MAX_HEIGHT / height)); height = MAX_HEIGHT; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);

                    // Payload final
                    const payload = {
                        filename: "photo_" + Date.now() + ".jpg",
                        mimeType: "image/jpeg",
                        base64: compressedBase64
                    };

                    // Envoi
                    fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
                    .then(response => response.json())
                    .then(data => {
                        if(data.status === "error") throw new Error(data.message);
                        resetUI();
                        statusDiv.innerText = "✅ Photo ajoutée à l'album Drive !";
                        statusDiv.classList.add("success");
                    })
                    .catch(error => {
                        sendDriveBtn.classList.remove("loading");
                        sendDriveBtn.innerText = "❌ Réessayer le Drive";
                        statusDiv.innerText = "❌ Erreur Drive : " + error.message;
                    });
                };
            };
        });

        cancelBtn.addEventListener('click', resetUI);

        function resetUI() {
            overlay.style.display = 'none';
            cameraInput.value = ""; // Réinitialiser l'input
            saveLocalBtn.disabled = false;
            saveLocalBtn.innerText = "📥 Enregistrer (mon téléphone)";
            sendDriveBtn.classList.remove("loading");
            sendDriveBtn.innerText = "☁️ Envoyer (Album Collectif)";
            statusDiv.classList.remove("success");
            statusDiv.innerText = "En attente d'une photo...";
        }
    </script>
</body>
</html>
